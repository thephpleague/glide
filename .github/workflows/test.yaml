name: glide

on:
  pull_request: ~
  push:
    branches:
      - master

jobs:
  tests:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.3', '8.4', '8.5']
        dependencies: [highest]
        include:
          - php-version: '8.3'
            dependencies: lowest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: gd, imagick
          coverage: pcov

      - name: Composer install
        uses: ramsey/composer-install@v4
        with:
          dependency-versions: ${{ matrix.dependencies }}

      - name: PHPUnit
        run: |
          if [[ ${{ matrix.php-version }} == '8.3' ]]; then
            vendor/bin/phpunit --display-incomplete --display-skipped --display-deprecations --display-phpunit-deprecations --coverage-clover=coverage.xml
          else
            vendor/bin/phpunit
          fi

      - name: Code Coverage Report
        if: matrix.php-version == '8.3'
        uses: codecov/codecov-action@v7

  tests-vips:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install libvips
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libvips42

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: gd, imagick, ffi
          ini-values: ffi.enable=true
          coverage: none

      # The vips driver is optional and requires ext-ffi, so it is only installed for this job
      - name: Add vips driver
        run: composer require --dev --no-update intervention/image-driver-vips

      - name: Composer install
        uses: ramsey/composer-install@v4

      - name: Check libvips is loadable
        run: php -r 'require "vendor/autoload.php"; echo "libvips ", Jcupitt\Vips\Config::version(), PHP_EOL;'

      - name: PHPUnit
        run: vendor/bin/phpunit --display-skipped

  coding-style:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd, imagick

      - name: Composer install
        uses: ramsey/composer-install@v4

      - name: php-cs-fixer
        run: |
          vendor/bin/php-cs-fixer fix --dry-run --diff --allow-risky=yes

  static-analysis:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd, imagick

      - name: Composer install
        uses: ramsey/composer-install@v4

      - name: phpstan
        if: always()
        run: |
          vendor/bin/phpstan --error-format=github
